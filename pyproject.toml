[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ctx"
version = "2.0.0"
description = "Zero-dependency MCP server: 10 surgical tools, 90%+ token reduction"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
zero-ctx = "zero_ctx.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zero_ctx*"]
